<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./app.css">
</head>
<body class="bg-ink font-sans text-white antialiased">
<div id="app" class="relative min-h-screen pb-[96px]">
  <section id="v-home" class="view"></section>
  <section id="v-explore" class="view"></section>
  <section id="v-channels" class="view"></section>
  <section id="v-channel" class="view"></section>
  <section id="v-settings" class="view"></section>
  <section id="v-library" class="view"></section>

  <!-- the watch view keeps its <video> while other views show, so playback goes on in the mini player -->
  <section id="v-watch" class="view">
    <div id="lofi" class="relative overflow-hidden rounded-b-[30px]" hidden></div>
    <div id="watchCard" class="overflow-hidden rounded-b-[30px] bg-panel">
      <div id="stage" class="group relative aspect-video w-full bg-black">
        <video id="video" class="absolute inset-0 h-full w-full" playsinline></video>
        <img id="poster" class="absolute inset-0 h-full w-full object-cover" alt="">
        <div id="shade" class="absolute inset-0 bg-black/25 transition-opacity"></div>
        <div id="controls" class="absolute inset-0 transition-opacity">
          <button data-act="back" class="absolute left-4 top-4 grid h-8 w-8 place-items-center" aria-label="Back"></button>
          <button data-act="search" id="stageSearch" class="absolute right-3 top-3 grid h-8 w-8 place-items-center rounded-full bg-black/30 backdrop-blur" aria-label="Search"></button>
          <div class="pointer-events-none absolute inset-0 flex items-center justify-center gap-5 [&>*]:pointer-events-auto">
            <button data-act="lofiPrev" id="ctlPrev" class="grid h-9 w-9 place-items-center opacity-90 hover:opacity-100" aria-label="Previous video"></button>
            <button data-act="rew" class="grid h-10 w-10 place-items-center" aria-label="Back 10 seconds"></button>
            <button data-act="toggle" id="bigPlay" class="grid h-12 w-12 place-items-center" aria-label="Play"></button>
            <button data-act="fwd" class="grid h-10 w-10 place-items-center" aria-label="Forward 10 seconds"></button>
            <button data-act="lofiNext" id="ctlNext" class="grid h-9 w-9 place-items-center opacity-90 hover:opacity-100" aria-label="Next video"></button>
          </div>
          <div class="absolute bottom-[12px] left-3 right-2 flex items-center gap-1">
            <span class="flex-1 text-[11px] tabular-nums"><span id="tCur">0:00</span><span class="text-white/60"> / </span><span id="tDur" class="text-white/60">0:00</span></span>
            <div class="group/vol flex items-center">
              <input id="volSlider" type="range" min="0" max="1" step="0.05" aria-label="Volume"
                class="vol-slider w-0 opacity-0 transition-all duration-200 group-hover/vol:w-[64px] group-hover/vol:opacity-100 focus:w-[64px] focus:opacity-100">
              <button data-act="mute" id="volBtn" class="grid h-8 w-8 place-items-center" aria-label="Mute"></button>
            </div>
            <button data-act="cc" id="ccBtn" class="grid h-8 w-8 place-items-center" aria-label="Captions"></button>
            <button data-act="pip" id="pipBtn" class="grid h-8 w-8 place-items-center" aria-label="Picture in picture"></button>
            <button data-act="settings" id="qualityBtn" class="flex h-8 items-center gap-1 pl-1 pr-1 text-[11px]" aria-label="Settings"></button>
          </div>
        </div>
        <div id="pmenu" class="absolute bottom-[50px] right-3 z-10 max-h-[calc(100%-62px)] min-w-[160px] overflow-y-auto rounded-xl bg-panel/95 py-1.5 text-[12px] shadow-[0_10px_30px_rgba(0,0,0,.5)] backdrop-blur" hidden></div>
        <div id="pipNote" class="absolute inset-0 grid place-items-center bg-black" hidden>
          <div class="text-center"><p class="text-[12.5px] text-[#ccc]">Playing in picture-in-picture</p>
            <button data-act="pip" class="mt-3 rounded-full bg-white/10 px-4 py-1.5 text-[12px]">Bring it back</button></div>
        </div>
        <div id="spin" class="pointer-events-none absolute inset-0 grid place-items-center" hidden><div class="spinner"></div></div>
        <div id="seekbar" class="absolute bottom-0 left-0 right-0 h-[14px] cursor-pointer">
          <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-white/20">
            <div id="pBuf" class="absolute inset-y-0 left-0 bg-white/30"></div>
            <div id="pCur" class="absolute inset-y-0 left-0 bg-brand"></div>
          </div>
        </div>
      </div>
      <div id="toolsHome" hidden></div>
      <div id="tools" class="px-4 pt-3"></div>
      <div id="audioCards" class="px-4"></div>
      <div id="watchInfo" class="px-5 pb-6 pt-3"></div>
    </div>
    <div id="comments" class="px-5"></div>
    <div id="watchMore" class="px-5"></div>
  </section>

  <!-- mini player + bottom navigation -->
  <div class="fixed inset-x-0 bottom-0 z-20">
    <div id="mini" class="rounded-t-[26px] bg-panel px-4 pb-1 pt-3" hidden></div>
    <nav id="nav" class="relative rounded-t-[26px] bg-panel px-4 pb-3 pt-3">
      <div id="navItems" class="grid grid-cols-5 text-center text-[11px]"></div>
    </nav>
  </div>
  <!-- search: the bar drops in front of everything, the rest dims and blurs -->
  <div id="searchOverlay" class="fixed inset-0 z-40" hidden>
    <div data-act="closeSearch" class="so-backdrop absolute inset-0 bg-black/65 backdrop-blur-[6px]"></div>
    <div class="so-panel relative px-3.5 pt-4">
      <form id="searchForm" class="so-bar flex items-center gap-3 rounded-full bg-[#f5f5f5] py-1.5 pl-5 pr-2 text-[#1c1c1c] shadow-[0_22px_60px_rgba(0,0,0,.6),0_2px_0_rgba(255,255,255,.6)_inset] ring-[3px] ring-brand/70" autocomplete="off">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="M16.5 16.5 20.5 20.5"/></svg>
        <input id="searchQ" class="h-10 min-w-0 flex-1 bg-transparent text-[14.5px] outline-none placeholder:text-[#9a9a9a]" placeholder="Search something..." enterkeyhint="search" spellcheck="false">
        <button type="button" id="searchClear" data-act="clearSearch" class="grid h-9 w-9 place-items-center rounded-full text-[#777] hover:bg-black/5" aria-label="Clear" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button type="submit" class="grid h-10 w-10 place-items-center rounded-full bg-brand text-white" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <ul id="searchSuggest" class="so-list mt-3 overflow-hidden rounded-[22px] bg-surface/95 py-1 shadow-[0_16px_40px_rgba(0,0,0,.5)]" hidden></ul>
    </div>
  </div>

  <!-- account sheet -->
  <div id="sheet" class="fixed inset-0 z-40" hidden>
    <div data-act="closeSheet" class="sheet-backdrop absolute inset-0 bg-black/60"></div>
    <div class="sheet-card absolute inset-x-0 bottom-0 rounded-t-[28px] bg-panel px-5 pb-8 pt-3">
      <div class="mx-auto mb-5 h-1 w-10 rounded-full bg-[#444]"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- offline: covers the page (not the bottom bar) until YouTube answers again -->
  <!-- first start: Tube installs yt-dlp, a JS runtime and ffmpeg into its own folder -->
  <div id="setupScreen" class="fixed inset-0 z-[16] flex flex-col items-center justify-center bg-ink px-10 text-center" hidden>
    <div class="grid h-[54px] w-[74px] place-items-center rounded-[14px] bg-brand text-white"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v2.6H6z"/><path d="M6.6 5.6h10.8L15.2 18H8.8z"/><path d="M9 18h6v3.2H9z"/><path d="M9.6 8.4l.8 6.4"/></svg></div>
    <p class="mt-6 text-[18px] font-bold">Setting up Tube</p>
    <p id="setupStep" class="mt-2 text-[12.5px] text-mute">Getting things ready…</p>
    <div class="mt-5 h-[6px] w-full max-w-[260px] overflow-hidden rounded-full bg-surface"><div id="setupBar" class="h-full w-0 rounded-full bg-brand transition-[width] duration-300"></div></div>
    <p class="mt-4 text-[11px] leading-relaxed text-mute">Only the first time: Tube downloads the video tools it needs. Nothing to install yourself.</p>
    <div id="setupError" class="mt-5" hidden><p id="setupErrorText" class="text-[12px] text-[#ffb4b4]"></p>
      <button data-act="retrySetup" class="mt-4 rounded-full border border-line px-6 py-2 text-[13px] hover:bg-white/5">Retry</button></div>
  </div>

  <div id="offline" class="fixed inset-0 z-[15] pb-[96px] flex flex-col items-center justify-center bg-ink px-8 text-center" hidden>
    <svg class="offline-art" width="210" height="190" viewBox="0 0 210 190" aria-hidden="true">
      <path d="M105 8c14 0 20 12 33 14s26-4 34 7-3 22 1 34 18 20 13 33-20 12-26 23-4 27-17 32-22-6-35-3-23 17-36 10-6-24-15-33-26-10-29-23 11-21 10-34-14-23-6-33 23-5 35-11S91 8 105 8z" fill="rgb(var(--brand) / .9)"/>
      <path d="M105 8c14 0 20 12 33 14s26-4 34 7-3 22 1 34 18 20 13 33-20 12-26 23-4 27-17 32-22-6-35-3-23 17-36 10-6-24-15-33-26-10-29-23 11-21 10-34-14-23-6-33 23-5 35-11S91 8 105 8z" fill="url(#offShade)"/>
      <defs>
        <linearGradient id="offShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
        <radialGradient id="offPlanet" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#d9d9d9"/></radialGradient>
      </defs>
      <circle cx="44" cy="52" r="4" fill="#fff" opacity=".7"/><circle cx="168" cy="40" r="2.5" fill="#fff" opacity=".8"/><circle cx="178" cy="120" r="3" fill="#fff" opacity=".6"/><circle cx="36" cy="128" r="2" fill="#fff" opacity=".7"/>
      <g transform="translate(150 70) rotate(-25)"><circle r="9" fill="#fff" opacity=".9"/><ellipse rx="17" ry="4.5" fill="none" stroke="#fff" stroke-width="2" opacity=".9"/></g>
      <ellipse cx="105" cy="150" rx="58" ry="30" fill="url(#offPlanet)"/>
      <ellipse cx="82" cy="146" rx="10" ry="5" fill="#000" opacity=".08"/><ellipse cx="124" cy="158" rx="13" ry="5" fill="#000" opacity=".08"/>
      <g class="offline-tv">
        <rect x="74" y="66" width="62" height="46" rx="11" fill="#fff"/>
        <rect x="81" y="73" width="48" height="32" rx="7" fill="#1c1c1c"/>
        <path d="M100 81v16l13-8z" fill="rgb(var(--brand))"/>
        <path d="M92 66 84 54M118 66l8-12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="84" cy="53" r="3" fill="#fff"/><circle cx="126" cy="53" r="3" fill="#fff"/>
        <path d="M95 112l-4 12M115 112l4 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <path d="M140 84c8-6 14-4 18 2" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="2 5"/>
      </g>
    </svg>
    <p class="mt-7 text-[19px] font-bold">Connect to the internet</p>
    <p class="mt-2.5 text-[12.5px] leading-relaxed text-mute">You're offline. Check your connection.</p>
    <button data-act="retryOnline" class="mt-6 rounded-full border border-line px-7 py-2.5 text-[13px] text-[#ddd] hover:bg-white/5">Retry</button>
  </div>

  <!-- notices: top right, newest on top, each with a close button -->
  <div id="toasts" class="pointer-events-none fixed right-3 top-3 z-50 flex w-[min(320px,calc(100%-24px))] flex-col items-end gap-2" aria-live="polite"></div>
</div>
<script src="./vendor/hls.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
